<!--
  RUNGFA — หน้าลิงก์ให้นายจ้างดูข้อมูลแรงงาน (Stage SHARE-001)
  * อ่านอย่างเดียว — ข้อมูลมาจาก Edge Function employer-share-view ด้วย token ในลิงก์ (?t=...)
  * ไฟล์นี้ไม่มี API key ใด ๆ
-->
<style>
:root{
  --bg:#f4f1ec; --card:#fff; --ink:#1d1a16; --mute:#7a7268; --line:#e7e1d8;
  --brand:#e8650c; --brand-d:#b94c03; --brand-soft:#fff1e6;
  --ok:#1f8a4c; --ok-soft:#e5f4ea; --warn:#c26a00; --warn-soft:#fff3dc;
  --bad:#c62828; --bad-soft:#fde8e8; --neutral-soft:#efece7;
  --font:'Prompt',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hd{background:linear-gradient(160deg,#f27a1a 0%,#d9560a 100%);color:#fff;padding:18px 16px 22px;border-radius:0 0 22px 22px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.06em;font-size:14px}
.logo i{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:600}
.ro{font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px}
.hd h1{font-size:20px;font-weight:600;margin-top:16px;line-height:1.3;word-break:break-word}
.hd .sub{font-size:13px;opacity:.88;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 10px;text-align:left;transition:background .15s}

/* Stage SHARE-FLAGS */
.avw{position:relative;flex:none}
.flg{position:absolute;right:-5px;bottom:-4px;width:20px;height:20px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);background:#fff;display:block}
.flg svg{width:100%;height:100%;display:block}
.dperson .flg{width:26px;height:26px;right:-6px;bottom:-5px}
.fi{display:inline-block;width:16px;height:11px;border-radius:2px;overflow:hidden;vertical-align:-1px;margin-right:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.fi svg{width:100%;height:100%;display:block}
.nchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 2px 10px}
.nchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 12px 5px 6px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.nchip .fi{width:22px;height:22px;border-radius:50%;margin:0;vertical-align:0}
.nchip small{font-weight:500;color:var(--mute);font-size:12px}
.nchip.on{background:var(--ink);border-color:var(--ink);color:#fff}.nchip.on small{color:rgba(255,255,255,.75)}
.nchip.all{padding-left:12px}
#list .nchips{grid-column:1/-1}
.dstrip{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.dstrip span{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;line-height:1;padding:4px 6px;border-radius:6px;white-space:nowrap;background:#f6f3ee;color:var(--mute);font-weight:500}
.dstrip span i{width:6px;height:6px;border-radius:50%;background:#cfc8bd;flex:none}
.dstrip .ok i{background:var(--ok)} .dstrip .warn{background:var(--warn-soft);color:var(--warn)} .dstrip .warn i{background:var(--warn)}
.dstrip .bad{background:var(--bad-soft);color:var(--bad)} .dstrip .bad i{background:var(--bad)}
/* Stage SHARE-S8 */
.hsum{display:flex;align-items:center;gap:7px;width:fit-content;max-width:100%;margin-top:10px;background:rgba(255,255,255,.16);border-radius:12px;padding:7px 12px;font-size:12.5px;color:#fff;line-height:1.35}
.hsum svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hsum b{font-size:14px}
.sec .scnt{font-weight:500;color:var(--mute);margin-left:4px}
.cta .soc{display:flex;gap:8px;flex:none;pointer-events:none}
.cta a.sb{flex:none;width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center;color:#fff;pointer-events:auto}
.cta a.sb svg{width:22px;height:22px}
.sb-fb{background:#1877f2}.sb-line{background:#06c755}.sb-tt{background:#111}
.cta a.sb[hidden]{display:none}
@media (max-width:420px){.cta a.sb{width:42px;height:42px}.cta .soc{gap:6px}}
/* Stage SHARE-S9: การ์ดกระชับ */
.w{padding:10px 12px;gap:11px;margin-bottom:7px}
.w .av{width:46px;height:54px}
.w .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.w .en{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.w .r2{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}
.w .r2 .pill{margin-top:0;flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;padding:2px 8px}
.w .r2 .wst{flex:0 1 auto;min-width:0;max-width:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset;font-size:10.5px;line-height:1.5;padding:1px 8px;border-radius:99px}
.w .dstrip{flex-wrap:nowrap;overflow:hidden;margin-top:5px}
#list .w{padding:11px 13px}
@media (min-width:700px){.w .r2 .wst{font-size:11px;padding:1px 9px}}
</style>

// Stage SHARE-S4: ลิงก์สั้น (c) หรือลิงก์ยาวเดิม (t)
const AUTH = /^[0-9a-f]{64}$/.test(TOKEN) ? {t:TOKEN} : (/^[0-9A-Za-z]{6,16}$/.test(CODE) ? {c:CODE} : null);
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
// ปี ≥2400 = กรอกเป็น พ.ศ. → แปลงเป็น ค.ศ. (Stage DATE-BE-FIX)
const parseD = s => { let [y,m,d]=String(s).slice(0,10).split('-').map(Number); if(y>=2400) y-=543; return new Date(y,m-1,d); };
const days = s => s ? Math.round((parseD(s) - TODAY)/864e5) : null;
const fdt = s => parseD(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#d9730d','#2e7d6b','#7b5ea7','#b5485d','#3b6fb6','#8a6d1f'];
// Stage SHARE-FLAGS: ธงชาติ SVG (viewBox 30x20)
const FLAGS={
  la:'<rect width="30" height="20" fill="#ce1126"/><rect y="5" width="30" height="10" fill="#002868"/><circle cx="15" cy="10" r="4" fill="#fff"/>',
  mm:'<rect width="30" height="6.7" fill="#fecb00"/><rect y="6.7" width="30" height="6.6" fill="#34b233"/><rect y="13.3" width="30" height="6.7" fill="#ea2839"/><polygon fill="#fff" points="15.0,3.4 16.6,8.3 21.8,8.4 17.7,11.5 19.2,16.4 15.0,13.4 10.8,16.4 12.3,11.5 8.2,8.4 13.4,8.3"/>',
  kh:'<rect width="30" height="20" fill="#032ea1"/><rect y="5" width="30" height="10" fill="#e00025"/><path fill="#fff" d="M9 13.6h12v-1H9zM10 12.6h10V11h-.8V9.6h-.7v1.4h-1V8.8h-.7V7.2h-.6V6h-.4v1.2h-.6v1.6h-.7V11h-1V9.6h-.7V11H10z"/>',
  vn:'<rect width="30" height="20" fill="#da251d"/><polygon fill="#ff0" points="15.0,4.3 16.4,8.4 20.7,8.4 17.2,11.0 18.5,15.2 15.0,12.6 11.5,15.2 12.8,11.0 9.3,8.4 13.6,8.4"/>',
  th:'<rect width="30" height="20" fill="#a51931"/><rect y="3.3" width="30" height="13.4" fill="#f4f5f8"/><rect y="6.7" width="30" height="6.6" fill="#2d2a4a"/>'};
const natKey=n=>{n=String(n||'').toLowerCase();return /ลาว|lao/.test(n)?'la':/เมียนมา|พม่า|myan|burm/.test(n)?'mm':/กัมพูชา|เขมร|camb|khmer/.test(n)?'kh':/เวียดนาม|viet/.test(n)?'vn':/ไทย|thai/.test(n)?'th':'';};
const flagSvg=n=>{const k=natKey(n);return k?`<svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${FLAGS[k]}</svg>`:'';};
const flagInline=n=>{const s=flagSvg(n);return s?`<i class="fi">${s}</i>`:'';};
let natF='';
function setNatF(n){ natF=n||''; render(); }
function natChips(){
  if(!DATA) return '';
  const m=new Map(); DATA.workers.forEach(w=>{const n=(w.nationality||'').trim(); if(n) m.set(n,(m.get(n)||0)+1);});
  if(m.size<2) return '';
  const arr=[...m.entries()].sort((a,b)=>b[1]-a[1]);
  return '<div class="nchips"><button class="nchip all'+(natF?'':' on')+'" onclick="setNatF(\'\')">ทุกสัญชาติ <small>'+DATA.workers.length+'</small></button>'+
    arr.map(([n,c])=>`<button class="nchip${n===natF?' on':''}" data-n="${esc(n)}" onclick="setNatF(this.dataset.n)">${flagInline(n)||''}${esc(n)} <small>${c}</small></button>`).join('')+'</div>';
}
const STRIP=[['passport','พาส'],['visa','วีซ่า'],['wp','ใบอนุญาต'],['d90','90 วัน']];
function docStrip(w){
  return '<div class="dstrip">'+STRIP.map(([k,l])=>{const doc=DOCS.find(d=>d.k===k);const s=st(doc,w.dates&&w.dates[k]);
    return `<span class="${s.c}" title="${esc(doc.short)} · ${esc(s.t)}"><i></i>${l}</span>`;}).join('')+'</div>';
}
function initials(w){
  const en=(w.name_en||'').replace(/^(MR|MRS|MISS|MS|MASTER)\.?\s+/i,'').trim();
  if(en) return en.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  return (w.name_th||'?').replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/,'').trim().slice(0,1);
}
const dispName = w => w.name_th || w.name_en || '—';
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }

function st(doc, s){
  const d = days(s);
  if (d===null) return { c:'na', t:'ไม่มีข้อมูล', d };
  if (d<0) return { c:'bad', t:`เลยมา ${-d} วัน`, d };
  if (d===0) return { c:'bad', t:'ครบวันนี้', d };
  if (d<=doc.warn) return { c:'warn', t:`อีก ${d} วัน`, d };
  return { c:'ok', t:`อีก ${d} วัน`, d };
}
function worst(w){
  let best=null;
  DOCS.forEach(doc=>{ const s=st(doc,w.dates[doc.k]); if(s.c==='na') return;
    const rank={bad:0,warn:1,ok:2}[s.c];
    if(!best || rank<best.rank || (rank===best.rank && s.d<best.s.d)) best={rank,s,doc}; });
  return best;
}
function avatar(w, extra='', eager=false){
  const bg=COLORS[w.id%COLORS.length];
  const th = thumbOf(w.photo);   // Stage SHARE-SMOOTH: มีรูปย่อในเครื่อง = ขึ้นทันที
  const img = !w.photo ? '' : th
    ? `<img src="${th}" alt="">`
    : `<img class="fade" src="${esc(w.photo)}" alt="" crossorigin="anonymous"${eager?'':' loading="lazy"'} onload="avLoaded(this)" onerror="avErr(this)">`;
  const fl=flagSvg(w.nationality);
  return `<div class="avw"><div class="av" style="background:${bg}" ${extra}>${esc(initials(w))}${img}</div>${fl?`<i class="flg" title="${esc(w.nationality||'')}">${fl}</i>`:''}</div>`;
}

let DATA=null, filter='all';
// Stage SHARE-GROUP: กรองตามนายจ้าง (ลิงก์กลุ่ม)
let empF='';
function setEmpF(n){ empF=n||''; render(); }
function empChips(){
  if(!DATA||!DATA.employer||!DATA.employer.group) return '';
  const emps=[...new Set(DATA.workers.map(w=>w.employer).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
  if(emps.length<2) return '';
  return '<div class="echips">'+['',...emps].map(n=>`<button class="echip${n===empF?' on':''}" data-n="${esc(n)}" onclick="setEmpF(this.dataset.n)">${n?esc(n):'ทุกนายจ้าง'}</button>`).join('')+'</div>';
}


async function api(body){
  const res = await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body)});   // Stage SHARE-FAST: ไม่มี preflight
  let d=null; try{ d=await res.json(); }catch(_){}
  return d || { ok:false, error:'network' };
}

function showMessage(title, text){
  document.getElementById('empName').textContent='ข้อมูลแรงงาน';
  document.getElementById('list').innerHTML=`<div class="msg"><b>${esc(title)}</b><p>${esc(text)}</p></div>`;
}

// Stage SHARE-FAST: จำข้อมูลล่าสุดไว้ในเครื่อง → เปิดลิงก์ซ้ำแสดงได้ทันที
const CACHE_KEY = AUTH ? 'rf_share_v1:'+(AUTH.c||String(AUTH.t).slice(0,16)) : '';
const CACHE_MAX = 3*864e5, URL_TTL = 12*60e3;   // ลิงก์รูปชั่วคราวอายุ 15 นาที → ใช้ซ้ำได้ไม่เกิน 12 นาที
const _base = u => String(u||'').split('?')[0];
function cacheRead(){ try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); return c&&c.d&&c.d.ok&&Date.now()-c.at<CACHE_MAX?c:null; }catch(_){ return null; } }
function cacheWrite(d){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), d})); }catch(_){} }
function cacheDrop(){ try{ localStorage.removeItem(CACHE_KEY); }catch(_){} }
let DATA_AT = 0;   // เวลาที่ได้ลิงก์รูปชุดที่แสดงอยู่ (ใช้ซ้ำเพื่อไม่ให้รูปกระพริบ/โหลดใหม่)

function applyData(d, at){
  // ข้อมูลเก่าในเครื่อง: ตัดลิงก์รูปที่หมดอายุแล้วทิ้ง (แสดงตัวอักษรย่อแทนจนกว่าข้อมูลใหม่มา)
  const fresh = Date.now()-at <= URL_TTL;   // Stage SHARE-SMOOTH
  if(!fresh){
    d.workers.forEach(w=>{ if(w.photo&&/^https:/.test(w.photo)&&!thumbOf(w.photo)) w.photo=null; });
    if(d.employer&&d.employer.banner&&!IMGC[_base(d.employer.banner)]) d.employer.banner=null;
  }
  // ข้อมูลใหม่มาแทนข้อมูลในเครื่อง: รูปไฟล์เดิมที่ลิงก์ยังไม่หมดอายุ → ใช้ลิงก์เดิม (ไม่โหลดซ้ำ ไม่กระพริบ)
  if(DATA && at>DATA_AT && Date.now()-DATA_AT < URL_TTL){
    const prev=new Map(DATA.workers.map(w=>[Number(w.id), w.photo]));
    d.workers.forEach(w=>{ const p=prev.get(Number(w.id)); if(p&&w.photo&&_base(p)===_base(w.photo)) w.photo=p; });
    const pb=DATA.employer&&DATA.employer.banner;
    if(pb&&d.employer&&d.employer.banner&&_base(pb)===_base(d.employer.banner)) d.employer.banner=pb;
    at=DATA_AT;
  }
  DATA=d; DATA_AT=at;
  // Stage SHARE-S3: พื้นหลังแถบบนของนายจ้าง/กลุ่ม (ถ้าตั้งไว้ใน CRM)
  setBanner(d.employer&&d.employer.banner, fresh);   // Stage SHARE-SMOOTH: จางเข้า + รูปที่จำไว้
  // ใช้ค่าแจ้งเตือนล่วงหน้าจาก CRM (ตั้งค่าแจ้งเตือน) ถ้ามี
  if(d.alerts){ const key={passport:'passport',visa:'visa',wp:'wp',d90:'next90',mou:'mou'}; DOCS.forEach(doc=>{ const v=Number(d.alerts[key[doc.k]]); if(v>0) doc.warn=v; }); }
  document.getElementById('stats').hidden=false;
  document.getElementById('searchBox').hidden=DATA.workers.length<6;
  const sig=dataSig(d);
  if(sig===DATA_SIG && document.querySelector('#list .w')){ updFoot(); return; }   // ข้อมูลเหมือนเดิม — ไม่วาดใหม่
  DATA_SIG=sig;
  render();
}

// ── Stage SHARE-SMOOTH: จำรูปย่อไว้ในเครื่อง → เปิดซ้ำรูปขึ้นทันที ไม่กระพริบ ──
const IMG_KEY = AUTH ? 'rf_share_img_v1:'+(AUTH.c||String(AUTH.t).slice(0,16)) : '';
const IMG_MAX = 80;
let IMGC = (()=>{ try{ const c=JSON.parse(localStorage.getItem(IMG_KEY)||'null'); return c&&c.m&&Date.now()-c.at<CACHE_MAX ? c.m : {}; }catch(_){ return {}; } })();
let _imgcT=0;
function imgcSave(){ clearTimeout(_imgcT); _imgcT=setTimeout(()=>{ try{ localStorage.setItem(IMG_KEY, JSON.stringify({at:Date.now(), m:IMGC})); }catch(_){} }, 500); }
function imgcDrop(){ IMGC={}; try{ localStorage.removeItem(IMG_KEY); }catch(_){} }
const thumbOf = u => (u && IMGC[_base(u)]) || null;
// ย่อรูปที่โหลดแล้ว (ต้องโหลดแบบ crossOrigin) เก็บเป็น JPEG เล็ก ๆ — w×h = ครอปเต็มกรอบ, h=0 = คงสัดส่วน
function rememberImg(im, u, w, h, q){
  try{
    const k=_base(u); if(!k||IMGC[k]||!im.naturalWidth) return;
    if(h && Object.keys(IMGC).length>=IMG_MAX) return;
    const iw=im.naturalWidth, ih=im.naturalHeight;
    const c=document.createElement('canvas');
    if(h){
      c.width=w; c.height=h;
      const s=Math.max(w/iw, h/ih), sw=w/s, sh=h/s;
      c.getContext('2d').drawImage(im, (iw-sw)/2, (ih-sh)/2, sw, sh, 0, 0, w, h);
    } else {
      const s=Math.min(1, w/iw); c.width=Math.round(iw*s); c.height=Math.round(ih*s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    }
    IMGC[k]=c.toDataURL('image/jpeg', q); imgcSave();
  }catch(_){ /* รูปไม่อนุญาต CORS — ข้าม */ }
}
function avLoaded(im){ im.classList.add('on'); if(im.crossOrigin) rememberImg(im, im.src, 120, 144, 0.8); }
function avErr(im){ if(im.crossOrigin){ const s=im.src; im.removeAttribute('crossorigin'); im.src=s; } else im.remove(); }
// พื้นหลังแถบบน: จางเข้า · มีรูปที่จำไว้ = ใช้เลย ไม่โหลดใหม่
function setBanner(bn, fresh){
  const hd=document.querySelector('.hd'); if(!hd) return;
  let L=hd.querySelector('.hdbg'); if(!L){ L=document.createElement('div'); L.className='hdbg'; hd.insertBefore(L, hd.firstChild); }
  const ok = bn && /^https:\/\//.test(bn);
  const k = ok ? _base(bn) : '';
  if(!k){ hd.dataset.bk=''; L.classList.remove('on'); hd.classList.remove('has-bg'); return; }
  const css = s => `url("${String(s).replace(/["\\\n\r]/g,'')}")`;
  const show = s => { L.style.backgroundImage=css(s); hd.classList.add('has-bg'); requestAnimationFrame(()=>L.classList.add('on')); };
  if(hd.dataset.bk===k) return;
  hd.dataset.bk=k;
  const th = IMGC[k];
  if(th){ show(th); return; }              // รูปที่จำไว้ (กว้าง 1100px) — ไม่ต้องโหลดใหม่
  if(!fresh) return;
  // โหลดครั้งเดียวแบบ CORS → ย่อเก็บ → แสดงรูปที่ย่อ (ไม่โหลดซ้ำ 2 รอบ)
  const im=new Image(); im.crossOrigin='anonymous'; im.decoding='async';
  im.onload=()=>{ if(hd.dataset.bk!==k) return; rememberImg(im, bn, 1100, 0, 0.72); show(IMGC[k]||bn); };
  im.onerror=()=>{ if(hd.dataset.bk!==k) return; show(bn); };   // ไม่อนุญาต CORS → แสดงตรง ๆ
  im.src=bn;
}
// ลายเซ็นข้อมูล (ไม่นับเวลาที่ดึง และ token ของลิงก์รูป) — เหมือนเดิม = ไม่ต้องวาดใหม่
const dataSig = d => JSON.stringify(d, (k,v)=> k==='generated_at' ? undefined : (typeof v==='string' && /^https:\/\//.test(v) ? _base(v) : v));
let DATA_SIG='';
function updFoot(){ if(DATA) document.getElementById('upd').textContent=`ข้อมูล ณ ${new Date(DATA.generated_at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} · บริษัท รุ่งฟ้า รุ่งฟ้า จำกัด`; }
async function load(){
  if(!AUTH){ showMessage('ลิงก์ไม่ถูกต้อง','กรุณาเปิดจากลิงก์ที่บริษัทส่งให้ทาง LINE หรือติดต่อบริษัท'); return; }
  const cached=cacheRead();
  if(cached){ try{ applyData(cached.d, cached.at); }catch(_){ DATA=null; } }
  let d=null;
  const E=window.__RF_EARLY;
  if(E && E.k===JSON.stringify(AUTH)){ try{ d=await E.p; }catch(_){ d=null; } }
  if(!d){ try{ d = await api({...AUTH}); }catch(_){ d={ok:false,error:'network'}; } }
  if(!d.ok){
    if(d.error==='invalid'){ cacheDrop(); DATA=null; document.getElementById('stats').hidden=true; document.getElementById('searchBox').hidden=true; document.getElementById('upd').textContent=''; setBanner(null, true); imgcDrop(); DATA_SIG=''; document.title='ข้อมูลแรงงาน · รุ่งฟ้า'; showMessage('ลิงก์นี้ใช้ไม่ได้แล้ว','ลิงก์อาจถูกยกเลิกหรือเปลี่ยนใหม่ กรุณาติดต่อบริษัทเพื่อขอลิงก์ล่าสุด'); }
    else if(DATA) toast('อัปเดตข้อมูลล่าสุดไม่สำเร็จ — แสดงข้อมูลที่บันทึกไว้');
    else showMessage('โหลดข้อมูลไม่สำเร็จ','กรุณาลองใหม่อีกครั้งในอีกสักครู่');
    return;
  }
  cacheWrite(JSON.parse(JSON.stringify(d)));
  applyData(d, Date.now());
}

function render(){
  const E=DATA.employer, W=DATA.workers;
  document.getElementById('empName').textContent=E.name||'ข้อมูลแรงงาน';
  document.title=`${E.name||'ข้อมูลแรงงาน'} · รุ่งฟ้า`;
  document.getElementById('empSub').textContent='ระบบติดตามเอกสารแรงงาน'+(E.group?` · ${E.employers||''} นายจ้าง`:(E.area?` · ${E.area}`:''));
  document.getElementById('upd').textContent=`ข้อมูล ณ ${new Date(DATA.generated_at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} · บริษัท รุ่งฟ้า รุ่งฟ้า จำกัด`;
  const tag=W.map(w=>({w,x:worst(w)}));
  document.getElementById('nAll').textContent=W.length;
  document.getElementById('nWarn').textContent=tag.filter(t=>t.x&&t.x.s.c==='warn').length;
  document.getElementById('nBad').textContent=tag.filter(t=>t.x&&t.x.s.c==='bad').length;
  const q=document.getElementById('q').value.trim().toLowerCase();
  const rows=tag.filter(t=>filter==='all'||(t.x&&t.x.s.c===filter))
    .filter(t=>!q||[t.w.name_th,t.w.name_en,t.w.passport_no,t.w.license_no,t.w.alien_id].join(' ').toLowerCase().includes(q))
    .filter(t=>!empF||t.w.employer===empF)
    .filter(t=>!natF||(t.w.nationality||'').trim()===natF)
    .sort((a,b)=>(a.x?a.x.rank:3)-(b.x?b.x.rank:3)||(a.x?a.x.s.d:1e9)-(b.x?b.x.s.d:1e9)||dispName(a.w).localeCompare(dispName(b.w),'th'));
  const L=document.getElementById('list');
  if(!W.length){ L.innerHTML='<div class="empty">ยังไม่มีรายชื่อแรงงานของนายจ้างนี้ในระบบ</div>'; return; }
  if(!rows.length){ L.innerHTML=empChips()+natChips()+'<div class="empty">ไม่พบแรงงานในกลุ่มนี้</div>'; return; }
  const head = filter==='all' ? 'เรียงจากเรื่องที่ต้องดูก่อน' : (filter==='bad'?'เลยกำหนดแล้ว':'ใกล้ครบกำหนด');
  shareSum(tag);
  const card=({w,x},i)=>`
    <button class="w" onclick="openW(${Number(w.id)})" onpointerdown="preThumbs(${Number(w.id)})">
      ${avatar(w,'',i<12)}
      <div class="mid">
        <div class="nm">${esc(dispName(w))}</div>
        ${(()=>{const en=[w.name_th&&w.name_en?w.name_en:'',natKey(w.nationality)?'':(w.nationality||''),DATA.employer.group&&w.employer?w.employer:''].filter(Boolean).join(' · ');return en?`<div class="en">${esc(en)}</div>`:'';})()}
        <div class="r2">${x?`<span class="pill p-${x.s.c}">${svg(x.s.c==='ok'?'check':x.s.c==='bad'?'alert':'clock')}${x.s.c==='ok'?'เอกสารปกติ':esc(x.doc.short)+' · '+x.s.t}</span>`:`<span class="pill p-na">${svg('calendar')}ยังไม่มีวันที่</span>`}${w.status?`<span class="wst" title="${esc(w.status)}">${esc(w.status)}</span>`:''}</div>
        ${docStrip(w)}
      </div>
      <span class="chev">›</span>
    </button>`;
  L.innerHTML=empChips()+natChips()+shareSections(rows,card,head);
}
// Stage SHARE-S8: แบ่งกลุ่มรายชื่อ + สรุปบนหัว
function shareSections(rows,card,head){
  let i=0; const block=(ic,col,txt,arr)=>arr.length?`<div class="sec">${hh(ic,col,txt+' <span class="scnt">'+arr.length+' คน</span>')}</div>`+arr.map(r=>card(r,i++)).join(''):'';
  if(filter!=='all') return block(filter==='bad'?'alert':'clock',filter==='bad'?'rose':'amber',head,rows);
  return block('alert','rose','ต้องดำเนินการ',rows.filter(r=>r.x&&r.x.s.c!=='ok'))
    +block('check','green','เอกสารปกติ',rows.filter(r=>r.x&&r.x.s.c==='ok'))
    +block('calendar','orange','ยังไม่มีวันที่เอกสาร',rows.filter(r=>!r.x));
}
function shareSum(tag){
  const el=document.getElementById('hsum'); if(!el) return;
  // Stage SHARE-S10: เกณฑ์เดียวกับการ์ด — ส้ม (ใกล้ครบ) + แดง (เลยกำหนด)
  let n=0; const ppl=new Set(); let over=0;
  DATA.workers.forEach(w=>DOCS.forEach(doc=>{const s=st(doc,w.dates&&w.dates[doc.k]); if(s.c==='warn'||s.c==='bad'){n++;ppl.add(w.id);if(s.c==='bad')over++;}}));
  const ic='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  el.innerHTML=ic+'<span>'+(n?`ต้องดำเนินการ <b>${n}</b> ฉบับ (${ppl.size} คน)`:'เอกสารทุกฉบับปกติ ยังไม่มีเรื่องต้องดำเนินการ')+(over?` · เลยกำหนด <b>${over}</b> ฉบับ`:'')+'</span>';
  el.hidden=false;
}

  const w=DATA.workers.find(x=>Number(x.id)===id); if(!w) return;
  const cards=DOCS.filter(doc=>!(doc.hideEmpty && !w.dates[doc.k])).map(doc=>{
    const s=st(doc,w.dates[doc.k]);
    const pct = s.d===null?0:Math.max(3,Math.min(100, s.d/doc.span*100));
    const docId = doc.doc && w.docs ? w.docs[doc.k] : null;
    // Stage SHARE-LOOK2: การ์ดสี่เหลี่ยม 2 คอลัมน์ (แบบเว็บขนส่ง)
    return `<div class="dq ${s.c}">
      <div class="qh">${chipi(...(DOC_IC[doc.k]||['mou','amber']))}<span>${esc(({d90:'รายงาน 90 วัน'})[doc.k]||doc.short)}</span></div>

      <div class="bar"><i style="width:${s.c==='bad'?100:pct}%"></i></div>
      ${docId?`<button class="view" onclick="openDoc(this,${Number(docId)},'${esc(doc.short)}')">ดูเอกสาร</button>`:(doc.doc?'<span class="nofile">ยังไม่มีไฟล์</span>':'<span class="nofile ph">&nbsp;</span>')}
    </div>`;}).join('');
  const files=Array.isArray(w.files)?w.files:[];
  const fileRows=files.map(f=>{
    const tl=TYPE_L[f.type]||'';
    const nm=f.name||tl||'เอกสาร';
    const sub=[f.name&&tl&&f.name!==tl?tl:'', f.date?'อัปโหลด '+fdt(f.date):'', f.expiry?'หมดอายุ '+fdt(f.expiry):''].filter(Boolean).join(' · ');

    ['วันเกิด',w.dob?fdt(w.dob):'','cake'],['เลขพาสปอร์ต',w.passport_no,'passport'],['เลขประจำตัวคนต่างด้าว',w.alien_id,'idc'],
    ['ใบอนุญาตทำงานเลขที่',w.license_no,'wp'],['เลขคำขอ',w.request_no,'hash'],['นายจ้าง',w.employer||DATA.employer.name,'building']]
    .map(([k,v,ic])=>`<div><span>${svg(ic,'kvi')}${k}</span><b>${esc(v||'—')}</b></div>`).join('');
  document.getElementById('dtIn').innerHTML=`
    <div class="dhd">
      <button class="back" onclick="history.back()">‹ กลับไปรายชื่อ</button>
      <div class="dperson">
        ${avatar(w, w.photo?`onclick="openPhoto(${Number(w.id)})"`:'', true)}
        <div><h2>${esc(dispName(w))}</h2>${w.name_th&&w.name_en?`<div class="en">${esc(w.name_en)}</div>`:''}
        <div class="meta">${w.nationality?flagInline(w.nationality):''}${esc([w.category, w.nationality, w.employer||DATA.employer.name].filter(Boolean).join(' · '))}</div></div>
      </div>
    </div>
    <div class="sec" style="margin:16px 18px 0">${hh('calendar','blue','กำหนดวันเอกสาร')}</div>
    <div class="docs dq2">${cards}</div>
    <div class="sec" style="margin:4px 18px 8px">${hh('folder','amber','เอกสารทั้งหมด ('+files.length+')')}</div>
    <div class="files">${fileRows||'<div class="none">ยังไม่มีไฟล์เอกสาร</div>'}</div>
    <div class="sec" style="margin:14px 18px 8px">${hh('user','teal','ข้อมูลส่วนตัว')}</div>
    <div class="kv">${kv}</div>`;
  { // Stage SHARE-TWEAK: หัวหน้ารายละเอียดใช้รูปพื้นหลังเดียวกับหน้าแรก (ใช้รูปที่โหลด/จำไว้แล้ว ไม่โหลดใหม่)
    const hb=document.querySelector('.hd .hdbg.on'), dh=document.querySelector('#dtIn .dhd');
    const bi=hb&&hb.style.backgroundImage;
    if(dh&&bi&&bi!=='none'){ dh.classList.add('has-bg'); dh.style.backgroundImage='linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,.46) 100%),'+bi; }
  }
  const dt=document.getElementById('dt'); dt.classList.add('open'); document.getElementById('dtbg').classList.add('on'); dt.scrollTop=0; dt.setAttribute('aria-hidden','false');
  history.pushState({v:'w'},'');
  loadThumbs(w);
}

const THUMBP={};   // Stage SHARE-FAST: เก็บ promise → แตะชื่อแล้วเริ่มโหลดได้ก่อนหน้ารายละเอียดเปิด
function thumbsFor(w){
  const c=THUMBP[w.id]; if(c&&Date.now()-c.t<10*60e3) return c.p;
  const p=api({...AUTH, worker_id:Number(w.id)}).then(d=>d&&d.ok?(d.thumbs||{}):null).catch(()=>null);
  THUMBP[w.id]={t:Date.now(),p}; p.then(m=>{ if(!m&&THUMBP[w.id]&&THUMBP[w.id].p===p) delete THUMBP[w.id]; });
  return p;
}
function preThumbs(id){ const w=DATA&&DATA.workers.find(x=>Number(x.id)===id); if(w&&(w.files||[]).some(f=>!f.pdf)) thumbsFor(w); }
async function loadThumbs(w){
  if(!(w.files||[]).some(f=>!f.pdf)) return;
  const m=await thumbsFor(w); if(!m) return;
  document.querySelectorAll('.files .ic[data-fid]').forEach(el=>{
    const u=m[el.dataset.fid]; if(!u||!/^https:\/\//.test(u)) return;
    const im=new Image(); im.alt=''; im.decoding='async'; im.onload=()=>{ el.innerHTML=''; el.appendChild(im); }; im.src=u;
  });
}
function openFile(el){ if(el.dataset.pdf==='1') pdfLib().catch(()=>{}); openDoc(el.querySelector('.go'), Number(el.dataset.id), el.dataset.n||'เอกสาร'); }
function closeW(){ const dt=document.getElementById('dt'); dt.classList.remove('open'); document.getElementById('dtbg').classList.remove('on'); dt.setAttribute('aria-hidden','true'); }
// Stage SHARE-PDF: เปิด PDF ในหน้าต่างดูเอกสาร (วาดด้วย PDF.js) — ไม่เด้งไปหน้าใหม่
const PDFJS_URL='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs';
const PDFJS_WORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs';
let _pdfLibP=null, PDFV=null;
function pdfLib(){
  if(!_pdfLibP){ _pdfLibP=import(PDFJS_URL).then(m=>{ m.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; return m; }); _pdfLibP.catch(()=>{ _pdfLibP=null; }); }
  return _pdfLibP;
}
const dlUrl = u => /^https:\/\//.test(u||'') ? u+(u.includes('?')?'&':'?')+'download=' : null;
function setDl(u, name){ const a=document.getElementById('ivDl'); if(!a) return; if(u){ a.href=u; a.hidden=false; if(/^data:/.test(u)) a.download=(name||'เอกสาร').replace(/[\\/:*?"<>|]+/g,' ')+'.pdf'; else a.removeAttribute('download'); } else { a.removeAttribute('href'); a.removeAttribute('download'); a.hidden=true; } }
function pdfStop(){
  const v=PDFV; PDFV=null;
  document.getElementById('iv').classList.remove('pdfon','pdfnat');
  const _bx=document.getElementById('ivImg'); _bx.classList.remove('pdf','nat'); _bx.onscroll=null;
  if(!v) return;
  if(v.blob){ try{ URL.revokeObjectURL(v.blob); }catch(_){} }
  try{ v.io&&v.io.disconnect(); }catch(_){}
  v.pages.forEach(p=>{ try{ p.task&&p.task.cancel(); }catch(_){} });
  try{ v.load&&v.load.destroy(); }catch(_){}
}
async function showPdf(label, src, dl){
  pdfStop();
  showViewer(label, '<div class="pdfmsg">กำลังโหลดเอกสาร…</div>');
  setDl(dl);
  const box=document.getElementById('ivImg'); box.classList.add('pdf');
  const my = PDFV = {zoom:1, rot:0, pages:[], vis:new Set(), io:null, load:null, doc:null, src, label};
  if(PDF_NATIVE()){   // Stage SHARE-TWEAK3: คอม — ใช้ตัวดู PDF ของเบราว์เซอร์ (บันทึก/พิมพ์/หมุน ในตัว)
    try{
      const buf = await (await fetch(src)).arrayBuffer();
      if(PDFV!==my) return;
      my.blob = URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
      box.classList.remove('pdf'); box.classList.add('nat');
      box.innerHTML = `<iframe class="pdfnat" title="${esc(label)}" src="${my.blob}#view=FitH"></iframe>`;
      document.getElementById('iv').classList.add('pdfnat');
      return;
    }catch(_){ if(PDFV!==my) return; box.classList.remove('nat'); box.classList.add('pdf'); }
  }
  try{
    const lib = await pdfLib();
    if(PDFV!==my) return;
    const opt = {isEvalSupported:false};
    if(/^data:/.test(src)) opt.data = new Uint8Array(await (await fetch(src)).arrayBuffer()); else opt.url = src;
    my.load = lib.getDocument(opt);
    const doc = await my.load.promise;
    if(PDFV!==my){ try{ doc.destroy(); }catch(_){} return; }
    my.doc = doc;
    const p1 = await doc.getPage(1);
    const v1 = p1.getViewport({scale:1});
    box.innerHTML='';
    for(let n=1;n<=doc.numPages;n++){
      const el=document.createElement('div'); el.className='pdfp'; el.dataset.n=n;
      el.innerHTML=`<span class="pn">${n} / ${doc.numPages}</span>`;
      box.appendChild(el);
      my.pages.push({n, el, ratio:v1.height/v1.width, page:n===1?p1:null, done:0, task:null});
    }
    document.getElementById('iv').classList.add('pdfon');
    pdfLayout(my);
    box.onscroll = () => pdfPgNow(my);   // Stage SHARE-TWEAK3: หน้าปัจจุบัน
    pdfPgNow(my);
    my.io = new IntersectionObserver(es=>{ es.forEach(e=>{ const pg=my.pages[Number(e.target.dataset.n)-1]; if(e.isIntersecting){ my.vis.add(pg); pdfDraw(my,pg); } else my.vis.delete(pg); }); }, {root:box, rootMargin:'700px 0px'});
    my.pages.forEach(pg=>my.io.observe(pg.el));
  }catch(e){
    if(PDFV!==my) return;
    document.getElementById('iv').classList.remove('pdfon'); box.classList.remove('pdf');
    box.innerHTML = /^https:\/\//.test(src)
      ? `<div class="pdfmsg">แสดงไฟล์ในหน้านี้ไม่ได้<br><a href="${esc(src)}" target="_blank" rel="noopener">เปิดไฟล์ PDF</a></div>`
      : '<div class="pdfmsg">ไม่สามารถแสดงไฟล์นี้ได้</div>';
  }
}
function pdfCssW(my){ const box=document.getElementById('ivImg'); return Math.max(200, (box.clientWidth-16)*my.zoom); }
function pdfLayout(my){
  const w=pdfCssW(my);
  my.pages.forEach(pg=>{ pg.el.style.width=w+'px'; pg.el.style.height=Math.round(w*pg.ratio)+'px'; });
  document.getElementById('pdfzv').textContent=Math.round(my.zoom*100)+'%';
}
async function pdfDraw(my, pg){
  const w=pdfCssW(my);
  if(pg.done===w || pg.busy===w) return;
  pg.busy=w;
  try{
    if(!pg.page) pg.page = await my.doc.getPage(pg.n);
    if(PDFV!==my) return;
    const v0=pg.page.getViewport({scale:1, rotation:(pg.page.rotate+my.rot)%360});
    if(Math.abs(v0.height/v0.width - pg.ratio)>0.001){ pg.ratio=v0.height/v0.width; pg.el.style.height=Math.round(w*pg.ratio)+'px'; }
    const dpr=Math.min(window.devicePixelRatio||1, 2);
    const scale=Math.min(w*dpr/v0.width, Math.sqrt(14e6/(v0.width*v0.height)));   // จำกัดขนาด canvas (iOS)
    const vp=pg.page.getViewport({scale, rotation:(pg.page.rotate+my.rot)%360});
    const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    if(pg.task){ try{ pg.task.cancel(); }catch(_){} }
    pg.task = pg.page.render({canvasContext:cv.getContext('2d'), viewport:vp});
    await pg.task.promise;
    if(PDFV!==my || pg.busy!==w) return;
    const old=pg.el.querySelector('canvas'); if(old) old.remove();
    pg.el.insertBefore(cv, pg.el.firstChild);
    pg.done=w;
  }catch(_){ /* ยกเลิก/วาดไม่สำเร็จ — ลองใหม่เมื่อเลื่อนมาอีกครั้ง */ }
  finally{ if(pg.busy===w) pg.busy=0; }
}
function zoomPdf(dir){
  const my=PDFV; if(!my||!my.pages.length) return;
  const steps=[0.5,0.75,1,1.25,1.5,2,2.5,3];
  let i=steps.findIndex(s=>s>=my.zoom-0.001); if(i<0) i=steps.length-1;
  const z=steps[Math.max(0,Math.min(steps.length-1,i+dir))]; if(z===my.zoom) return;
  const box=document.getElementById('ivImg');
  const fy=(box.scrollTop+box.clientHeight/2)/Math.max(1,box.scrollHeight), fx=(box.scrollLeft+box.clientWidth/2)/Math.max(1,box.scrollWidth);
  my.zoom=z; pdfLayout(my);
  box.scrollTop=fy*box.scrollHeight-box.clientHeight/2; box.scrollLeft=fx*box.scrollWidth-box.clientWidth/2;
  my.vis.forEach(pg=>pdfDraw(my,pg));
}
// ── Stage SHARE-TWEAK3: แถบเครื่องมือ PDF ── (Stage SHARE-TWEAK4: หมุน = ค่าหมุนของไฟล์ + ที่ผู้ใช้กด)
const PDF_NATIVE = () => { try{ return matchMedia('(pointer:fine) and (min-width:900px)').matches && !/\bLine\//i.test(navigator.userAgent); }catch(_){ return false; } };
function pdfPgNow(my){
  if(PDFV!==my||!my.pages.length) return;
  const box=document.getElementById('ivImg'), y=box.scrollTop+box.clientHeight*0.35;
  let n=1; for(const pg of my.pages){ if(pg.el.offsetTop<=y) n=pg.n; else break; }
  const el=document.getElementById('pdfPg'); if(el) el.textContent=n+' / '+my.pages.length;
}
function fitPdf(){
  const my=PDFV; if(!my||!my.pages.length) return;
  const box=document.getElementById('ivImg'), cur=my.pages[0];
  const fitPage=Math.max(0.25, Math.min(1, (box.clientHeight-20)/((box.clientWidth-16)*cur.ratio)));
  my.zoom = Math.abs(my.zoom-1)<0.001 ? fitPage : 1;
  pdfLayout(my); my.vis.forEach(pg=>pdfDraw(my,pg)); pdfPgNow(my);
}
function rotPdf(){
  const my=PDFV; if(!my||!my.pages.length) return;
  my.rot=(my.rot+90)%360;
  my.pages.forEach(pg=>{ pg.done=0; if(pg.page){ const v=pg.page.getViewport({scale:1, rotation:(pg.page.rotate+my.rot)%360}); pg.ratio=v.height/v.width; } else pg.ratio=1/pg.ratio; });
  pdfLayout(my); my.vis.forEach(pg=>pdfDraw(my,pg)); pdfPgNow(my);
}
function savePdf(){
  const a=document.getElementById('ivDl');
  if(a&&a.href&&!a.hidden){ a.click(); return; }
  toast('ไฟล์นี้บันทึกไม่ได้');
}
async function printPdf(){
  const my=PDFV; if(!my||!my.doc) return;
  if(/\bLine\//i.test(navigator.userAgent)){ toast('แอป LINE พิมพ์ไม่ได้ — กด "บันทึก" หรือเปิดลิงก์ใน Chrome/Safari'); return; }
  toast('กำลังเตรียมพิมพ์…');
  try{
    const out=document.getElementById('pdfPrint')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'pdfPrint'}));
    out.innerHTML='';
    for(let n=1;n<=my.doc.numPages;n++){
      const page=await my.doc.getPage(n); if(PDFV!==my) return;
      const v0=page.getViewport({scale:1, rotation:(page.rotate+my.rot)%360});
      const scale=Math.min(1600/v0.width, Math.sqrt(14e6/(v0.width*v0.height)));
      const vp=page.getViewport({scale, rotation:(page.rotate+my.rot)%360});
      const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
      await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
      const im=new Image(); im.src=cv.toDataURL('image/jpeg',0.92); out.appendChild(im);
    }
    await Promise.all([...out.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
    document.body.classList.add('pdfprint');
    const done=()=>{ document.body.classList.remove('pdfprint'); out.innerHTML=''; window.removeEventListener('afterprint',done); };
    window.addEventListener('afterprint',done);
    setTimeout(()=>{ window.print(); setTimeout(()=>{ if(!matchMedia('print').matches) done(); },1500); },60);
  }catch(_){ toast('เตรียมพิมพ์ไม่สำเร็จ — กด "บันทึก" แล้วพิมพ์จากไฟล์'); }
}
let _pdfRz=0;
window.addEventListener('resize',()=>{ clearTimeout(_pdfRz); _pdfRz=setTimeout(()=>{ const my=PDFV; if(my&&my.pages.length){ pdfLayout(my); my.vis.forEach(pg=>pdfDraw(my,pg)); } },200); });
function showViewer(title, html){
  document.getElementById('ivT').textContent=title;
  document.getElementById('ivImg').innerHTML=html;
  document.getElementById('iv').classList.add('open');
  history.pushState({v:'img'},'');
}
function closeImg(){ pdfStop(); setDl(null); document.getElementById('iv').classList.remove('open'); document.getElementById('ivImg').innerHTML=''; }
window.addEventListener('popstate',()=>{
  if(document.getElementById('iv').classList.contains('open')) closeImg();
  else if(document.getElementById('dt').classList.contains('open')) closeW();
});
function openPhoto(id){ const w=DATA.workers.find(x=>Number(x.id)===id); if(w&&w.photo) showViewer(dispName(w), `<img src="${esc(w.photo)}" alt="">`); }

async function openDoc(btn, docId, label){
  btn.disabled=true; const old=btn.textContent; btn.textContent='กำลังเปิด…';
  try{
    const d = await api({...AUTH, doc_id:docId});
    if(!d.ok){ toast(d.error==='invalid'?'ลิงก์นี้ใช้ไม่ได้แล้ว':'เปิดเอกสารไม่สำเร็จ'); return; }
    const ft=(d.file_type||'').toLowerCase();
    let src=d.url||d.data_url;
    const isPdf = ft.includes('pdf') || /^data:application\/pdf/.test(src||'');
    if(isPdf){ showPdf(label, src, dlUrl(d.url)||(/^data:application\/pdf/.test(src||'')?src:null)); setDl(dlUrl(d.url)||(/^data:application\/pdf/.test(src||'')?src:null), label); return; }   // Stage SHARE-PDF: เปิดในหน้าเดิม
    pdfStop();
    showViewer(label, `<img src="${esc(src)}" alt="" onerror="this.replaceWith('ไม่สามารถแสดงไฟล์นี้ได้')">`);
    setDl(dlUrl(d.url));
  }catch(_){ toast('เปิดเอกสารไม่สำเร็จ'); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

document.querySelectorAll('.stat').forEach(b=>b.onclick=()=>{ if(!DATA) return; filter=b.dataset.f; document.querySelectorAll('.stat').forEach(x=>x.classList.toggle('on',x===b)); render(); });
document.getElementById('q').oninput=()=>DATA&&render();
// Stage SHARE-S5: ปัดขวาเพื่อกลับไปรายชื่อ
(function(){
  const dt=document.getElementById('dt'); if(!dt) return;
  let x0=null,y0=0,dx=0,drag=false;
  dt.addEventListener('touchstart',e=>{ if(!dt.classList.contains('open')||e.touches.length!==1) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; drag=false; },{passive:true});
  dt.addEventListener('touchmove',e=>{
    if(x0===null) return; const t=e.touches[0], mx=t.clientX-x0, my=t.clientY-y0;
    if(!drag){ if(mx>12 && Math.abs(mx)>Math.abs(my)*1.3){ drag=true; dt.style.transition='none'; } else if(Math.abs(my)>12 || mx<-12){ x0=null; return; } else return; }
    dx=Math.max(0,mx); dt.style.transform='translateX('+dx+'px)';
  },{passive:true});
  const end=()=>{
    if(x0===null) return; x0=null; if(!drag) return; drag=false; dt.style.transition='';
    if(dx>Math.min(110,dt.offsetWidth*0.28)){ dt.style.transform='translateX(100%)'; history.back(); setTimeout(()=>{dt.style.transform='';},320); }
    else dt.style.transform='';
  };
  dt.addEventListener('touchend',end); dt.addEventListener('touchcancel',end);
})();
