<!--
  RUNGFA — เว็บรายรับ-รายจ่าย ขนส่งพัสดุ (Stage PARCEL-001)
  * ไฟล์นี้ไม่มี API key ใด ๆ — ทุกคำสั่งผ่าน Edge Function parcel-api + session token ของระบบขนส่ง
  * /pv/<รหัส> หรือ ?c=<รหัส> = โหมดดูอย่างเดียว (ไม่ต้องล็อกอิน)
-->
<style>
:root{
  --bg:#f4f1ec; --card:#fff; --ink:#1d1a16; --mute:#7a7268; --line:#e7e1d8;
  --brand:#e8650c; --brand-d:#b94c03; --brand-soft:#fff1e6;
  --ok:#1f8a4c; --ok-soft:#e5f4ea; --warn:#c26a00; --warn-soft:#fff3dc;
  --bad:#c62828; --bad-soft:#fde8e8; --blue:#1d5fa8; --blue-soft:#e8f1fb; --neutral-soft:#efece7; --self:#6a4a9c; --self-soft:#efe8f8;
  --font:'Prompt',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
/* มือถือ: ล็อกซูม + หน้าไม่เลื่อนซ้าย-ขวา (ตารางกว้างยังเลื่อนได้ภายในกล่องของตัวเอง) */
html,body{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:pan-y}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.hd{background:linear-gradient(160deg,#f27a1a 0%,#d9560a 100%);color:#fff;padding:14px 16px 16px;border-radius:0 0 20px 20px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.04em}
.brand img{width:36px;height:36px}
.brand small{display:block;font-weight:500;letter-spacing:0;font-size:12px;opacity:.9}
.who{font-size:12.5px;text-align:right;line-height:1.3}
.who button{margin-top:3px;font-size:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;color:#fff}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto}
.tab{flex:none;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:14px}
.tab.on{background:#fff;color:var(--brand-d)}
.tbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:#d32f2f;color:#fff;font-size:11px;line-height:18px;text-align:center;vertical-align:1px}
.tab.on .tbadge{background:var(--bad);color:#fff}

async function api(a,args){
  let d=null;
  try{
    const r=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({a,t:TOKEN||undefined,args:(VIEW_CODE||a==='login'||a==='logout'||(args&&'branch' in args))?(args||{}):Object.assign({branch:BR||''},args||{})})});
    d=await r.json();
  }catch(_){d={ok:false,error:'network'};}
  if(!d) d={ok:false,error:'network'};
  if(!d.ok && d.error==='unauthorized' && !VIEW_CODE && a!=='login'){ TOKEN=''; ls.del(TK); showLogin('กรุณาเข้าสู่ระบบใหม่'); }
  return d;
}

function showLogin(msg){
  document.getElementById('app').innerHTML=`
  <div class="login">
    <div style="text-align:center;margin-bottom:16px"><img src="${LOGO}" alt="" style="width:64px;height:64px"><div style="font-weight:600;margin-top:6px">${SHOP_NAME}</div><div class="note">รายงานรายรับ-รายจ่าย</div><div class="note">บริษัท รุ่งฟ้า รุ่งฟ้า จำกัด</div></div>
    <form class="card f" id="lf" autocomplete="on">
      <h2>เข้าสู่ระบบ</h2>

      <div><label class="l" for="lp">รหัสผ่าน</label><input class="in" id="lp" type="password" autocomplete="current-password" required></div>
      <div class="err" id="le">${esc(msg||'')}</div>
      <button class="btn btn-p" id="lb">เข้าสู่ระบบ</button>

  </div>`;
  document.getElementById('lf').onsubmit=async e=>{

// บรรทัดย่อยในการ์ด: ขยายตัวหนังสือให้เต็มความกว้างการ์ดพอดี 1 บรรทัด (สูงสุด 14px) — ความสูงบรรทัดคงที่ การ์ดไม่ขยาย
function fitSmall(){ document.querySelectorAll('.kpi small').forEach(el=>{ const r=document.createRange(); r.selectNodeContents(el); let f=14; el.style.fontSize=f+'px'; const cw=el.clientWidth-2; while(r.getBoundingClientRect().width>cw&&f>10){ f-=0.25; el.style.fontSize=f+'px'; } }); }

        <div class="f"><div><label class="l">เลขพัสดุ</label><input class="in" id="fTrk" value="${esc(F.tracking_no||'')}" oninput="setF('tracking_no',this.value)" autocapitalize="characters"></div>

function impDate(v){

async function impFile(f){

    const hi=arr.findIndex(r=>r.some(c=>_nz(c)==='หมายเลขรายการ'));
    if(hi<0) throw new Error('ไม่พบหัวคอลัมน์ "หมายเลขรายการ" — ใช่ไฟล์รายงานจาก PayPoint ไหม?');

}

    ${selfR.filter(r=>!reqName(r.customer_name)).length?`<div class="abad" style="margin-bottom:12px">${ic('alert')}ของบริษัท ${selfR.filter(r=>!reqName(r.customer_name)).length} ชิ้น ไม่มีชื่อคนสั่ง — จะขึ้นในหน้า ตรวจสอบ</div>`:''}

      const pay=skip?`<span class="note">${r.exists?'มีแล้ว':r.dup?'ซ้ำ':'ไม่ครบ'}</span>`:(p==='self'?`<span class="tag self" style="margin-left:0">บริษัท · ${reqName(r.customer_name)?esc(reqName(r.customer_name)):'<span style="color:var(--bad)">ไม่ระบุคนสั่ง</span>'}</span>`:`<div class="paysw"><button type="button" class="${p==='cash'?'on cash':''}" onclick="impSetRowPay(${i},'cash')">เงินสด</button><button type="button" class="${p==='transfer'?'on transfer':''}" onclick="impSetRowPay(${i},'transfer')">โอน</button></div>`);
      return `<tr style="${skip?'opacity:.45':''}"><td style="vertical-align:top">${r.date?fdate(r.date):'<span style="color:var(--bad)">?</span>'}</td><td style="text-align:left;white-space:normal;min-width:120px">${esc(r.carrier)} · ${esc(r.tracking_no)}<div class="note">${esc(r.customer_name)}</div><div style="margin-top:6px">${pay}</div></td><td style="vertical-align:top">${p==='self'&&!skip?`<span style="color:var(--self)">0</span><div class="note">ทุน ${money(r.cost)}</div>`:`${money(r.price)}<div class="note">ทุน ${money(r.cost)} · +${money(num(r.price)-num(r.cost))}</div>`}</td></tr>`;}).join('')}
    </table></div>

  </div>`:''}`;
}
async function impRun(){
  const nw=IMP.rows.filter(r=>!r.exists&&!r.bad&&!r.dup); if(!nw.length) return;
  const b=document.getElementById('impGo'); b.disabled=true;
  let ins=0,skip=0,bad=0,car=0;
  for(let i=0;i<nw.length;i+=200){
    b.textContent=`กำลังนำเข้า ${Math.min(i+200,nw.length)}/${nw.length}…`;
    const d=await api('import',{rows:nw.slice(i,i+200).map(r=>({ext_ref:r.ext_ref,date:r.date,carrier:r.carrier,tracking_no:r.tracking_no,customer_name:r.customer_name,price:r.price,cost:r.cost,pay:r.pay||IMP.pay}))});
    if(!d.ok){ toast(errMsg(d.error)); b.disabled=false; b.textContent='ลองนำเข้าอีกครั้ง'; return; }
    ins+=d.inserted; skip+=d.skipped; bad+=(d.invalid||[]).length; car+=d.carriers_added||0;
  }
  toast(`นำเข้าแล้ว ${ins} รายการ`+(skip?` · ข้าม ${skip}`:'')+(bad?` · ไม่ครบ ${bad}`:'')+(car?` · เพิ่มขนส่งใหม่ ${car}`:''));
  if(car) await reloadBoot();
  const latest=nw.map(r=>r.date).sort().pop(); if(latest){ const [y,m]=latest.split('-').map(Number); Y=y; M=m; }
  IMP=null; KIND='ship'; TAB='entry'; await loadMonth(); shell(); render();
}

async function shareAct(a,conf){ if(conf&&!confirm(conf)) return; const d=await api(a); if(!d.ok){toast(errMsg(d.error));return;} LINK=d.link; toast(a==='share_revoke'?'ยกเลิกลิงก์แล้ว':'สร้างลิงก์แล้ว'); render(); }
function copyLink(u){ (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('คัดลอกลิงก์แล้ว')).catch(()=>prompt('คัดลอกลิงก์นี้',u)); }
async function saveBranch(id){ const name=(document.getElementById(id?'bn'+id:'bnNew').value||'').trim(); if(!name){toast('กรุณาใส่ชื่อสาขา');return;} const d=await api('save',{branch:'',kind:'branch',row:id?{id,name}:{name}}); if(!d.ok){toast(errMsg(d.error));return;} await reloadBoot(); shell(); toast('บันทึกแล้ว'); render(); }
async function saveOpening(){ const op={cash:Number(document.getElementById('opC').value)||0,transfer:Number(document.getElementById('opT').value)||0}; const d=await api('opening_save',op); if(!d.ok){toast(errMsg(d.error));return;} OPENINGS[String(BR)]=op; await loadMonth(); toast('บันทึกแล้ว'); }
async function saveCoNames(){ const names=(document.getElementById('coTa').value||'').split('\n').map(s=>s.trim()).filter(Boolean); const d=await api('save',{kind:'company_names',row:{names}}); if(!d.ok){toast(errMsg(d.error));return;} await reloadBoot(); toast('บันทึกแล้ว'); render(); }
async function saveStaff(){ const names=(document.getElementById('staffTa').value||'').split('\n').map(s=>s.trim()).filter(Boolean); const d=await api('save',{branch:'',kind:'staff',row:{names}}); if(!d.ok){toast(errMsg(d.error));return;} await reloadBoot(); await loadMonth(); toast('บันทึกแล้ว'); render(); }
async function reloadBoot(){ const d=await api('boot'); if(d.ok){ CARRIERS=d.carriers||[]; OPENINGS=d.openings||OPENINGS; BRANCHES=d.branches||BRANCHES; STAFF=d.staff||STAFF; CONAMES=d.company_names||CONAMES; } }
const WALLETS=()=>CARRIERS.filter(c=>c.is_wallet);
async function setWallet(id,v){ const c=CARRIERS.find(x=>x.id===id); const d=await api('carrier_save',{id,name:c.name,wallet_id:v?Number(v):null}); if(!d.ok){toast(errMsg(d.error));return;} await reloadBoot(); await loadMonth(); toast('บันทึกแล้ว'); render(); }
async function saveCarrier(id){ const name=(document.getElementById(id?'cn'+id:'cnNew').value||'').trim(); if(!name){toast('กรุณาใส่ชื่อขนส่ง');return;} const w=WALLETS()[0]; const d=await api('carrier_save',id?{id,name}:{name,wallet_id:w?w.id:null}); if(!d.ok){toast(errMsg(d.error));return;} await reloadBoot(); toast('บันทึกแล้ว'); render(); }
async function toggleCarrier(id,active){ const c=CARRIERS.find(x=>x.id===id); const d=await api('carrier_save',{id,name:c.name,active}); if(!d.ok){toast(errMsg(d.error));return;} await reloadBoot(); render(); }
async function addUser(){ const d=await api('user_save',{username:document.getElementById('nuU').value.trim(),full_name:document.getElementById('nuN').value.trim(),password:document.getElementById('nuP').value,branch_id:Number(document.getElementById('nuB').value)}); if(!d.ok){toast(errMsg(d.error));return;} USERS=null; toast('เพิ่มผู้ใช้แล้ว'); render(); }
async function resetPw(id){ const p=prompt('รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)'); if(!p) return; const d=await api('user_save',{id,password:p}); if(!d.ok){toast(errMsg(d.error));return;} toast('ตั้งรหัสใหม่แล้ว — ผู้ใช้นี้ต้องเข้าสู่ระบบใหม่'); }
async function toggleUser(id,active){ if(!active&&!confirm('ปิดใช้ผู้ใช้นี้? จะถูกออกจากระบบทันที')) return; const d=await api('user_save',{id,active}); if(!d.ok){toast(errMsg(d.error));return;} USERS=null; render(); }

// ───────── เริ่ม ─────────
(async function start(){
  if(VIEW_CODE){ TAB='sum'; shell(); if(await loadMonth()){ shell(); render(); } return; }   // แท็บ ตรวจสอบ ขึ้นเฉพาะลิงก์รวมทุกสาขา
  if(!TOKEN){ showLogin(''); return; }
  await boot();
})();
</script>
